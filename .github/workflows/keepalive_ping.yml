name: Database Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 24 hours at 05:00 UTC to prevent free-tier Supabase & Appwrite idling
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  ping-databases:
    name: Ping Supabase and Appwrite Databases
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Postgres (Direct Table Query)
        run: |
          echo "Executing direct PostgREST query to Supabase missing_reports table..."
          curl -sS -f \
            -H "apikey: sb_publishable_lNWUFJ2y25Qva4hpOHQsAg_0ZsWN3x9" \
            -H "Authorization: Bearer sb_publishable_lNWUFJ2y25Qva4hpOHQsAg_0ZsWN3x9" \
            -H "Prefer: count=exact" \
            "https://gfblezjsmpbyucjwxmju.supabase.co/rest/v1/missing_reports?select=id&limit=1"
          echo -e "\n[SUCCESS] Supabase direct database query executed successfully."

      - name: Ping Appwrite Database (Direct Documents Query)
        run: |
          echo "Executing direct query to Appwrite missing_reports collection..."
          curl -sS -f \
            -H "X-Appwrite-Project: 6a44fd1100236aa6e14a" \
            "https://syd.cloud.appwrite.io/v1/databases/6a4ba8910003f31c09e9/collections/missing_reports/documents"
          echo -e "\n[SUCCESS] Appwrite direct database query executed successfully."
